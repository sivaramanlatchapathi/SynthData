[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthdata"
version = "0.1.0"
authors = [
  { name="Your Name", email="you@example.com" },
]
description = "A Python package for generating synthetic tabular data."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0", # For preprocessing, metrics
    "tensorflow>=2.5.0",   # For TVAE and potentially CTGAN
    "torch>=1.9.0",      # For CTGAN and potentially TVAE
    "matplotlib>=3.4.0", # For visualizations
    "seaborn>=0.11.0",   # For enhanced visualizations
]

[project.urls]
"Homepage" = "https://github.com/yourusername/synthdata"
"Bug Tracker" = "https://github.com/yourusername/synthdata/issues"